# This is a Databricks asset bundle definition for cicd_proj.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: cicd_proj
  uuid: f00c06b2-339b-4ab6-b57b-0cd8e78253d5

include:
  - resources/*.yml

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The catalog to use
  schema:
    description: The schema to use

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://dbc-16140102-f40e.cloud.databricks.com
    variables:
      catalog: dev_cicd_catalog
      schema: dev
  prod:
    mode: production
    workspace:
      host: https://dbc-16140102-f40e.cloud.databricks.com
      # We explicitly deploy to /Workspace/Users/naveenkumar.vs@prodapt.com to make sure we only have a single copy.
      root_path: /Workspace/Users/naveenkumar.vs@prodapt.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: dev_cicd_catalog
      schema: prod
    permissions:
      - user_name: naveenkumar.vs@prodapt.com
        level: CAN_MANAGE
